spring.datasource.url=jdbc:h2:mem:bidpro-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=bidpro-integration-test-signing-key-not-for-production-2026
app.seed.enabled=false
app.upload-dir=./target/test-uploads

# Tests never use an operator's real email credentials or background delivery.
app.mail.mode=outbox
app.notifications.scheduler-enabled=false
app.auctions.settlement-enabled=false
