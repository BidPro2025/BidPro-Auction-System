# Start explicitly with SPRING_PROFILES_ACTIVE=production after provisioning the schema.
# This profile includes mysql and fails closed when local/test settings are mixed in.
spring.jpa.hibernate.ddl-auto=validate
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.seed.enabled=false
payments.local-test=false
app.mail.mode=smtp
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=30000
