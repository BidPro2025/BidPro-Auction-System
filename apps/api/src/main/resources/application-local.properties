# Standalone development database. Data survives restarts; no database server is required.
spring.datasource.url=jdbc:h2:file:./data/bidpro;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:local-development-only-change-before-deploying-bidpro-jwt-key-2026}
app.seed.enabled=${SEED_DEMO:true}

# Explicit local sandbox only; never enabled by the MySQL/production profile.
payments.local-test=${PAYMENTS_LOCAL_TEST:true}
