spring.application.name=bidpro
spring.profiles.default=local
spring.profiles.group.production=mysql
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.upload-dir=${UPLOAD_DIR:./data/uploads}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.connection-timeout=10s
server.tomcat.max-http-form-post-size=6MB
server.tomcat.threads.max=${HTTP_THREADS_MAX:100}
server.tomcat.accept-count=${HTTP_ACCEPT_QUEUE:100}
server.forward-headers-strategy=none
logging.pattern.level=%5p [request:%X{requestId:-none}]
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Outbox mode captures emails locally. SMTP delivery is explicitly enabled by MAIL_MODE=smtp.
app.public-url=${APP_PUBLIC_URL:http://127.0.0.1:5173}
app.mail.mode=${MAIL_MODE:outbox}
app.mail.from=${MAIL_FROM:no-reply@bidpro.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
